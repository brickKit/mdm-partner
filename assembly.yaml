id: mdm/customer                     # 必须与 component.yaml 一致，be-ops 校验

domain: mdm
tier: backend

edge_routes:
  - { path: /mdm/customer/**, auth: required }

menus:
  - { key: mdm.customer, title: 客户管理, permission: mdm.customer.view }

data:
  schema: mdm_customer               # registry/schemas.tsv
  role:   mdm_customer_rw            # 登录角色，`PG_USER` 的值

data_scopes: none                    # 客户主数据全员可见（设计书 §14.2.2：mdm 4 个组件全部 none）

permissions:
  - { key: mdm.customer.view,        title: 查看客户主数据,     type: page   }
  - { key: mdm.customer.create,      title: 新建客户,           type: action }
  - { key: mdm.customer.update,      title: 编辑客户,           type: action }
  - { key: mdm.customer.set_status,  title: 启用/停用客户,      type: action }
  - { key: mdm.customer.add_contact, title: 新增客户联系人,     type: action }
