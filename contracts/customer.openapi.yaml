openapi: 3.0.3
info:
  title: mdm-customer · 客户主数据
  version: 2.0.1
  description: |
    对外 REST 面；别的组件走 gRPC（contracts/mdm/customer/v1/customer.proto）。
    BatchGet 只在 gRPC 上：它是给别的组件防 N+1 的批量读，暴露成公网 REST
    等于给了一个"按 id 列表一次拿走一批客户"的接口。

    /healthz 不在这份契约里：它是 be-sdk-go 的 NewGinEngine 给每个组件统一
    挂的裸根路径，不带 /mdm/customer 前缀。

servers:
  - url: /mdm/customer

paths:
  /customers:
    get:
      summary: List
      operationId: listCustomers
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: |
            关键字，匹配 code 或 name，大小写不敏感，% 与 _ 按字面匹配。code 或
            name 以 q 开头的排在只是包含 q 的前面，同一档内按建档时间倒序。去掉
            首尾空白后为空等于不传。时间窗口照常生效：要搜更早建档的客户，显式
            给 created_after。
        - name: cursor
          in: query
          schema: { type: string }
          description: 上一页返回的 next_cursor，原样回传；只对发出它的那组查询参数有效。没有 offset 参数。
        - name: page_size
          in: query
          schema: { type: integer }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/CustomerStatus" }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: created_after / created_before 是 RFC 3339 时间；不传时默认最近 90 天。格式不对返回 400。
      responses:
        "200":
          description: OK；最后一页的 next_cursor 是空字符串
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Create
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{id}:
    get:
      summary: Get
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{id}/status:
    post:
      summary: SetStatus
      operationId: setCustomerStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetStatusRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /customers/{id}/contacts:
    post:
      summary: AddContact
      operationId: addCustomerContact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddContactRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  responses:
    BadRequest:
      description: 参数不合法：credit_limit 不是非负十进制（最多 16 位整数、2 位小数，不收 NaN / Inf / 科学计数法）、status 不是 ACTIVE / DISABLED、缺必填字段、时间或游标格式不对
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 客户不存在（含不是数字的 id）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 冲突：version 过期（乐观锁，gRPC ABORTED），或显式传入的 code 已被占用（gRPC ALREADY_EXISTS）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    CustomerStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    Contact:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        primary: { type: boolean }

    BillingInfo:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        tax_no: { type: string }
        bank_name: { type: string }
        bank_account: { type: string }
        address: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        tax_no: { type: string }
        credit_limit:
          type: string
          description: 十进制字符串（浮点数跨语言会丢精度）
        status: { $ref: "#/components/schemas/CustomerStatus" }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
        billing_infos:
          type: array
          items: { $ref: "#/components/schemas/BillingInfo" }

    CreateRequest:
      type: object
      required: [idempotency_key, name]
      properties:
        idempotency_key:
          type: string
          description: 幂等键：同一个键重复提交返回第一次的结果，不新建
        code:
          type: string
          description: 可选，留空则按 "C" + 6 位自增数字生成
        name: { type: string }
        tax_no: { type: string }
        credit_limit:
          type: string
          description: 非负十进制字符串，最多 16 位整数、2 位小数（NUMERIC(18,2)）；不收 NaN / Inf / 科学计数法。留空为 0

    UpdateRequest:
      type: object
      required: [idempotency_key, version]
      properties:
        idempotency_key: { type: string }
        version:
          type: integer
          format: int64
          description: 乐观锁，与库里不一致则拒绝
        name: { type: string }
        tax_no: { type: string }
        credit_limit:
          type: string
          description: 非负十进制字符串，最多 16 位整数、2 位小数（NUMERIC(18,2)）；不收 NaN / Inf / 科学计数法。留空为 0

    SetStatusRequest:
      type: object
      required: [idempotency_key, version, status]
      properties:
        idempotency_key: { type: string }
        version: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/CustomerStatus" }

    AddContactRequest:
      type: object
      required: [idempotency_key, contact]
      properties:
        idempotency_key: { type: string }
        contact: { $ref: "#/components/schemas/Contact" }
